<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>140lsl 的主页</title>
    <style>
        /* 基础重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        /* 卡片容器 */
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            width: 90%;
            max-width: 450px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* 头像 */
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #4a90e2;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 40px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(74, 144, 226, 0.4);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        p {
            font-size: 14px;
            color: #7f8c8d;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* 按钮组 */
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 500;
            transition: all 0.3s ease;
            background: #f0f2f5;
            color: #2c3e50;
        }

        .btn:hover {
            background: #4a90e2;
            color: white;
            box-shadow: 0 5px 15px rgba(74, 144, 226, 0.3);
        }

        /* 页脚 */
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 头像占位，你可以换成 <img src="图片链接"> -->
        <div class="avatar">L</div>
        
        <h1>Hello, I'm 140lsl</h1>
        <p>欢迎来到我的个人主页！<br>这里记录我的折腾日常。</p>

        <div class="links">
            <!-- 下面的 # 可以换成你的真实链接 -->
            <a href="https://github.com/140lsl" class="btn" target="_blank">GitHub 主页</a>
            <a href="#" class="btn">我的博客</a>
            <a href="#" class="btn">联系我</a>
        </div>

        <div class="footer">
            © 2026 140lsl. Powered by GitHub Pages.
        </div>
    </div>

</body>
</html>
